# Coder Workspace Workflow - tmux configuration

# Use 256-color mode (compatible with macOS Terminal.app)
set -g default-terminal "tmux-256color"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Status bar. The left segment shows the cww workspace name (the tmux session
# is always called 'main' — cww's attach/poll plumbing relies on that name, so
# it stays; CWW_WORKSPACE comes from the container env). Falls back to the
# session name outside a cww container. Single quotes defer $-expansion to the
# #() shell, which inherits the tmux server's environment.
set -g status-style bg=colour235,fg=colour136
set -g status-left '#[fg=green]#(echo "${CWW_WORKSPACE:-#S}") '
set -g status-right "#[fg=yellow]#(cd /workspace && git branch --show-current 2>/dev/null) #[fg=white]| %H:%M"
set -g status-right-length 60
set -g status-left-length 32

# Window status
setw -g window-status-current-style fg=colour166,bold
setw -g window-status-style fg=colour244

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour166

# Use Ctrl-a as prefix (easier than Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Quick pane cycling with Ctrl-a twice
bind-key C-a last-window

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Don't rename windows automatically
set-option -g allow-rename off

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Copy mode: vi keys, and a drag-release copies the selection instead of just
# clearing the highlight.
#
# Where that selection can go depends on the terminal on the other end, because
# tmux has nothing to shell out to here: there is no pbcopy in a Linux
# container, and the X display the built-in browser runs on is a different
# clipboard from the developer's desktop. That leaves OSC 52, which asks the
# terminal to set the clipboard on tmux's behalf — 'set-clipboard on' makes
# tmux emit it for its own copy commands, not just forward what applications
# inside send. Terminals that implement OSC 52 (iTerm2, Ghostty, WezTerm,
# kitty) put the drag straight onto the system clipboard. Terminal.app does
# not implement it and silently drops the escape, so there the selection stays
# in tmux's buffer for 'prefix + ]' and reaching the system clipboard still
# needs the bypass modifier documented in the user guide.
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# The escape hatch from all of the above: drop the mouse and the terminal gets
# click-drag and the wheel back — its own selection and its own scrollback,
# with no bypass modifier to hold. Overrides the default mark-pane binding.
bind m set -g mouse \; display "mouse #{?mouse,on,off}"
